name = "webaurix"
compatibility_date = "2024-09-23"

# Static-assets-only Worker (no server script). Serves the Vite `dist/`
# output. Per-route index.html files (from the injectRouteMeta plugin) are
# served directly at their clean URLs; any unmatched path falls back to the
# root index.html so React Router client-side routes still resolve.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

    <!-- ════════ INSTANT SPLASH SCREEN (pure CSS, paints before JS/React) ════════ -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(ellipse 60% 50% at 50% 38%, rgba(104, 181, 204, 0.14), transparent 70%),
          linear-gradient(155deg, #0b0b0e 0%, #0d1017 55%, #0b0c10 100%);
        opacity: 1;
        transition: opacity 0.6s ease, visibility 0.6s ease;
        font-family: "Nata Sans", "Roboto", system-ui, sans-serif;
      }
      #splash.splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* logo + rotating ring */
      .splash-logo-wrap {
        position: relative;
        width: 132px;
        height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #68b5cc;
        border-right-color: rgba(104, 181, 204, 0.35);
        animation: splash-spin 1s linear infinite;
      }
      .splash-ring.r2 {
        inset: 12px;
        border-top-color: transparent;
        border-bottom-color: rgba(104, 181, 204, 0.6);
        animation: splash-spin 1.6s linear infinite reverse;
      }
      .splash-glow {
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(104, 181, 204, 0.22), transparent 70%);
        animation: splash-pulse 2s ease-in-out infinite;
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: splash-breathe 2.4s ease-in-out infinite;
        z-index: 2;
      }

      /* wordmark */
      .splash-word {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        opacity: 0;
        animation: splash-rise 0.7s ease forwards 0.15s;
      }
      .splash-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #f0eeec;
      }
      .splash-tag {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        text-transform: uppercase;
        color: rgba(240, 238, 236, 0.4);
      }

      /* loading bar */
      .splash-bar {
        position: relative;
        width: 150px;
        height: 2.5px;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
        margin-top: 6px;
        opacity: 0;
        animation: splash-rise 0.7s ease forwards 0.3s;
      }
      .splash-bar::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 4px;
        background: linear-gradient(90deg, transparent, #68b5cc, transparent);
        animation: splash-slide 1.2s ease-in-out infinite;
        will-change: transform;
      }

      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(375%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-ring, .splash-ring.r2, .splash-glow, .splash-logo, .splash-bar::before { animation: none; }
      }
    </style>

    <!-- Fail-safe: force-remove splash after 8s even if the bundle stalls -->
    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          var s = document.getElementById("splash");
          if (s && !s.classList.contains("splash-hide")) s.classList.add("splash-hide");
        }, 8000);
      });
